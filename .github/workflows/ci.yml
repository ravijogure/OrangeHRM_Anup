name: OrangeHRM Automation Tests

on:

  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:
    inputs:
      test_type:
        description: 'Select test type'
        required: true
        default: 'regression'
        type: choice
        options:
          - smoke
          - regression


jobs:

  test:

    runs-on: ubuntu-latest

    env:
      TEST_GROUP: ${{ github.event_name == 'workflow_dispatch' && inputs.test_type || 'regression' }}

    steps:

      # ==========================================
      # Checkout Source Code
      # ==========================================

      - name: Checkout source code

        uses: actions/checkout@v4


      # ==========================================
      # Setup JDK 17
      # ==========================================

      - name: Set up JDK 17

        uses: actions/setup-java@v4

        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      # ==========================================
      # Setup Chrome
      # ==========================================

      - name: Set up Chrome

        uses: browser-actions/setup-chrome@v1


      # ==========================================
      # Run Tagged Maven Tests
      # ==========================================

      - name: Run ${{ env.TEST_GROUP }} tests

        run: mvn clean test -Dgroups=${TEST_GROUP}


      # ==========================================
      # Upload Surefire Reports
      # ==========================================

      - name: Upload Surefire Reports

        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: surefire-reports
          path: target/surefire-reports/


      # ==========================================
      # Upload Extent Report
      # ==========================================

      - name: Upload Extent Report

        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: extent-report
          path: test-output/ExtentReport.html
          if-no-files-found: ignore


      # ==========================================
      # Upload Failure Screenshots
      # ==========================================

      - name: Upload Failure Screenshots

        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore